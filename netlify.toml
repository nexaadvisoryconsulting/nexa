[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The blog is hosted on Blogger at blog.nexa.com.np, so the old /blog URLs redirect there.
[[redirects]]
  from = "/blog"
  to = "https://blog.nexa.com.np"
  status = 301
  force = true
[[redirects]]
  from = "/blog/*"
  to = "https://blog.nexa.com.np"
  status = 301
  force = true
